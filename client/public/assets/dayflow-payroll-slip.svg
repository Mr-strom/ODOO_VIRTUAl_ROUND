<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="paygrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b6e69" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e76f51" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Watermark geometry for payslip -->
  <rect width="300" height="200" fill="url(#paygrad)"/>
  <circle cx="220" cy="100" r="80" stroke="#0b6e69" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="4 4"/>
  <circle cx="220" cy="100" r="60" stroke="#0b6e69" stroke-width="1" stroke-opacity="0.25"/>
  <circle cx="220" cy="100" r="40" stroke="#e76f51" stroke-width="1.5" stroke-opacity="0.3"/>
  <circle cx="220" cy="100" r="20" fill="#0b6e69" fill-opacity="0.1"/>

  <!-- Bank / currency glyph watermark -->
  <path d="M180 100 L260 100" stroke="#0b6e69" stroke-width="1" stroke-opacity="0.3"/>
  <path d="M220 60 L220 140" stroke="#0b6e69" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="20" y="30" width="120" height="8" rx="2" fill="#0b6e69" fill-opacity="0.1"/>
  <rect x="20" y="46" width="80" height="6" rx="2" fill="#0b6e69" fill-opacity="0.08"/>
  <rect x="20" y="60" width="100" height="6" rx="2" fill="#0b6e69" fill-opacity="0.08"/>
</svg>
