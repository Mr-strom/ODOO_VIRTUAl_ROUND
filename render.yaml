services:
  - type: web
    name: dayflow-hrms
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && npm install -g pnpm && pnpm install --frozen-lockfile && pnpm build
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 20.11.0
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dayflow-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://dayflow-hrms.onrender.com

databases:
  - name: dayflow-db
    databaseName: dayflow
    user: dayflow
    plan: free